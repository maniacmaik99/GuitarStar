name: Release

# Builds the Windows installer and the Linux bundles (AppImage, .deb) and
# attaches them to one GitHub release.
# Start it by pushing a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; set up with scripts/set-release-secrets.ps1.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GuitarStar ${{ github.ref_name }}
          releaseBody: |
            ## Installation

            1. **`GuitarStar_…_x64-setup.exe`** unten unter „Assets“ herunterladen und starten.
            2. Windows zeigt eventuell „Der Computer wurde durch Windows geschützt“, weil das Programm (noch) nicht signiert ist: **Weitere Informationen → Trotzdem ausführen**.
            3. GuitarStar starten und den Rocksmith-Ordner auswählen.

            Voraussetzung: Rocksmith 2014 Edition – Remastered (Steam). Rust, Node.js o. Ä. werden **nicht** gebraucht.

            **Linux / Steam Deck (Vorschau, noch wenig getestet):** `GuitarStar_…_amd64.AppImage` (ausführbar machen und starten; aktualisiert sich selbst) oder `GuitarStar_…_amd64.deb`. Rocksmith läuft dort über Proton; GuitarStar zeigt die nötigen Steam-Startoptionen und ob wineasio eingerichtet ist.

            Alle Änderungen am Spielordner lassen sich in GuitarStar unter „Verlauf“ zurücknehmen.
          releaseDraft: false
          # Must be a full release: the in-app updater reads releases/latest,
          # which skips pre-releases.
          prerelease: false
          includeUpdaterJson: true

  linux:
    # Runs after the Windows job: that job creates the release, this one uploads
    # into it and adds the linux-x86_64 entries to the existing latest.json.
    # Running both at once would race on creating the release and on latest.json.
    needs: windows
    # Oldest supported Ubuntu keeps the AppImage compatible with older glibc (Steam Deck included).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Bundle targets (appimage, deb) come from src-tauri/tauri.linux.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Same tag: tauri-action finds the release the Windows job created and uploads into it.
          tagName: ${{ github.ref_name }}
          releaseName: GuitarStar ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
