[package]
name = "guitarstar_core"
version = "0.1.0"
description = "Game folder, audio and component logic of GuitarStar, independent of the UI"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com"] }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"
