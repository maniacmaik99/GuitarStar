[package]
name = "guitarstar"
version = "0.1.0"
description = "Rocksmith 2014 Remastered setup, mod and CDLC manager"
authors = ["Maik Schultheiß"]
license = "MIT"
repository = "https://github.com/maniacmaik99/GuitarStar"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "guitarstar_lib"
# Desktop only: a cdylib (needed for mobile) exceeds the export limit of the
# MinGW linker used by the windows-gnu toolchain.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews, used to show CustomsForge inside the main window.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
guitarstar_core = { path = "core" }

[workspace]
members = [".", "core"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
